name: Academic-inspired research metrics — zero paid calls
on:
  push:
    branches: [eval/academic-methods-oct30]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-metric-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODEL_API_KEY: ''
      EVIDENCETRAIL_ENABLE_MUSE: 'false'
      EVIDENCETRAIL_PROVIDER: mock
      EVIDENCETRAIL_ENABLE_META_VISION: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify benchmark methodology does not invent metrics
        run: python -m unittest tests.test_academic_evidence_metrics -v
      - name: Validate research-backed paired perturbation corpus and integrity rules
        run: python -m unittest tests.test_metamorphic_research_metrics -v
      - name: Freeze paired research manifest but do not claim a model score
        run: |
          python scripts/metamorphic_research_metrics.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/academic-methods/metamorphic_report.json').read_text())
          assert not d['model_results_measured']
          assert d['completed_pairs']==0
          assert d['author_declared_pairs']==12
          print('12 prespecified paired CV tests; NO LIVE MODEL RESULTS: PASS')
          PY
      - name: Execute empty honest input; no claimed research performance
        run: |
          python scripts/academic_evidence_metrics.py evaluation/academic_metric_inputs.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/academic-methods/metric_report.json').read_text())
          assert not report['claims_authorized']
          assert report['status']=='NO ACADEMIC BENCHMARK DATA YET'
          assert report['total']==0
          print('NO FAKE BENCHMARK RESULTS: PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-benchmark-integrity-report
          path: |
            artifacts/academic-methods/metric_report.json
            artifacts/academic-methods/metamorphic_report.json
          retention-days: 14
          if-no-files-found: warn
