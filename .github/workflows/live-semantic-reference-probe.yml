name: EvidenceTrail capped genuine Muse semantic reference probe
on:
  push:
    branches: [eval/semantic-benchmark-oct29]
    paths: [.github/workflows/live-semantic-reference-probe.yml]
permissions:
  contents: read
concurrency:
  group: evidencetrail-live-reference-oct29-once
  cancel-in-progress: false
jobs:
  live-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCETRAIL_PROVIDER: muse
      EVIDENCETRAIL_ENABLE_MUSE: 'true'
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MUSE_REASONING_EFFORT: minimal
      MAX_ANALYSES_PER_PROCESS: '12'
      MAX_ANALYSES_PER_HOUR_PER_IP: '15'
      MAX_CONCURRENT_ANALYSES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eval/semantic-benchmark-oct29
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python -m pip install -r requirements.txt
      - name: Refuse network work without pre-existing Meta credit configuration
        run: |
          if [ -z "$MODEL_API_KEY" ]; then echo "Missing key; no calls executed"; exit 2; fi
      - name: Run ten genuine Muse CV analyses and four blind readouts, no retries
        run: PYTHONPATH=. python scripts/live_semantic_reference_eval.py
      - name: Preserve per-case receipts, source-free responses and error examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencetrail-genuine-muse-semantic-reference-probe
          path: artifacts/live-semantic-eval/
          retention-days: 14
